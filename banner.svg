<svg width="680" height="110" viewBox="0 0 680 110" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; font-size: 13px; }

      .base { fill: #d8d8d8; animation: flicker 4s infinite; }
      @keyframes flicker {
        0%,84%,100% { opacity:1; }
        86% { opacity:.6; }
        88% { opacity:1; }
        91% { opacity:.7; }
        93% { opacity:1; }
      }

      /* heavy stretch layers — pulled left and right */
      .gl-l { fill: #fff; filter: url(#glow-soft); animation: stretch-l 4s infinite; transform-origin: center; }
      .gl-r { fill: #fff; filter: url(#glow-soft); animation: stretch-r 4s infinite; transform-origin: center; }
      .gl-xl { fill: #fff; filter: url(#glow-hard); animation: stretch-xl 4s infinite; transform-origin: center; }
      .gl-xr { fill: #fff; filter: url(#glow-hard); animation: stretch-xr 4s infinite; transform-origin: center; }

      /* pulled hard left */
      @keyframes stretch-l {
        0%,82%,100% { opacity:0; transform:translate(0,0) scaleX(1); clip-path:none; }
        84% { opacity:.9; transform:translate(-18px,0) scaleX(1.06); clip-path:polygon(0 5%, 100% 5%, 100% 28%, 0 28%); }
        86% { opacity:.8; transform:translate(-24px,0) scaleX(1.09); clip-path:polygon(0 55%,100% 55%,100% 72%,0 72%); }
        88% { opacity:.7; transform:translate(-14px,0) scaleX(1.04); clip-path:polygon(0 80%,100% 80%,100% 100%,0 100%); }
        90% { opacity:0; }
      }

      /* pulled hard right */
      @keyframes stretch-r {
        0%,84%,100% { opacity:0; transform:translate(0,0) scaleX(1); clip-path:none; }
        86% { opacity:.9; transform:translate(20px,0) scaleX(1.07); clip-path:polygon(0 15%,100% 15%,100% 38%,0 38%); }
        88% { opacity:.8; transform:translate(28px,0) scaleX(1.10); clip-path:polygon(0 60%,100% 60%,100% 78%,0 78%); }
        90% { opacity:.7; transform:translate(16px,0) scaleX(1.05); clip-path:polygon(0 0%,100% 0%,100% 12%,0 12%); }
        92% { opacity:0; }
      }

      /* extreme left pull — big bloom */
      @keyframes stretch-xl {
        0%,87%,100% { opacity:0; transform:translate(0,0) scaleX(1); clip-path:none; }
        89% { opacity:.6; transform:translate(-38px,0) scaleX(1.14); clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%); }
        91% { opacity:.5; transform:translate(-44px,0) scaleX(1.18); clip-path:polygon(0 68%,100% 68%,100% 85%,0 85%); }
        93% { opacity:0; }
      }

      /* extreme right pull — big bloom */
      @keyframes stretch-xr {
        0%,89%,100% { opacity:0; transform:translate(0,0) scaleX(1); clip-path:none; }
        91% { opacity:.6; transform:translate(40px,0) scaleX(1.15); clip-path:polygon(0 10%,100% 10%,100% 32%,0 32%); }
        93% { opacity:.5; transform:translate(50px,0) scaleX(1.20); clip-path:polygon(0 52%,100% 52%,100% 70%,0 70%); }
        95% { opacity:0; }
      }
    </style>

    <filter id="glow-soft" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-hard" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="680" height="110" fill="#000"/>

  <!-- base -->
  <text x="340" y="18"  text-anchor="middle" class="mono base" xml:space="preserve"> ██████╗██╗  ██╗███████╗██████╗ ███╗   ██╗</text>
  <text x="340" y="33"  text-anchor="middle" class="mono base" xml:space="preserve">██╔════╝╚██╗██╔╝██╔════╝██╔══██╗████╗  ██║</text>
  <text x="340" y="48"  text-anchor="middle" class="mono base" xml:space="preserve">██║      ╚███╔╝ █████╗  ██████╔╝██╔██╗ ██║</text>
  <text x="340" y="63"  text-anchor="middle" class="mono base" xml:space="preserve">██║      ██╔██╗ ██╔══╝  ██╔══██╗██║╚██╗██║</text>
