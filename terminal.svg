<svg width="700" height="320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0d0d0d; }
      .titlebar { fill: #1a1a1a; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .text { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #ffffff; }
      .prompt { fill: #ffffff; }
      .dim { fill: #555555; }
      .val { fill: #eeeeee; }
      .key { fill: #888888; }
      .border { fill: none; stroke: #333333; stroke-width: 1; }

      .line1 { animation: appear 0.1s 0.3s both; }
      .line2 { animation: appear 0.1s 1.2s both; }
      .line3 { animation: appear 0.1s 1.5s both; }
      .line4 { animation: appear 0.1s 1.8s both; }
      .line5 { animation: appear 0.1s 2.1s both; }
      .line6 { animation: appear 0.1s 2.4s both; }
      .line7 { animation: appear 0.1s 2.7s both; }
      .line8 { animation: appear 0.1s 3.0s both; }
      .line9 { animation: appear 0.1s 3.3s both; }
      .cursor { animation: blink 1s 3.6s infinite; }

      @keyframes appear {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Window -->
  <rect width="700" height="320" rx="10" ry="10" class="bg"/>
  
  <!-- Title bar -->
  <rect width="700" height="36" rx="10" ry="10" class="titlebar"/>
  <rect y="18" width="700" height="18" class="titlebar"/>
  
  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" class="dot-red"/>
  <circle cx="40" cy="18" r="6" class="dot-yellow"/>
  <circle cx="60" cy="18" r="6" class="dot-green"/>
  
  <!-- Title -->
  <text x="350" y="23" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="12" fill="#555">cxern@null: ~</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="699" height="319" rx="10" ry="10" class="border"/>

  <!-- Line 1: prompt + command -->
  <g class="line1">
    <text x="20" y="68" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">┌──[</text>
    <text x="60" y="68" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">cxern</text>
    <text x="100" y="68" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">@null]──[~]</text>
    <text x="20" y="86" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">└─$ </text>
    <text x="50" y="86" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">cat /etc/cxern</text>
  </g>

  <!-- Divider -->
  <g class="line2">
    <text x="20" y="110" font-family="Share Tech Mono, monospace" font-size="13" fill="#333">────────────────────────────────────────────────────</text>
  </g>

  <!-- handle -->
  <g class="line3">
    <text x="30" y="132" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">handle     </text>
    <text x="118" y="132" font-family="Share Tech Mono, monospace" font-size="13" fill="#444">::</text>
    <text x="136" y="132" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">  cxern</text>
  </g>

  <!-- uid -->
  <g class="line4">
    <text x="30" y="152" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">uid        </text>
    <text x="118" y="152" font-family="Share Tech Mono, monospace" font-size="13" fill="#444">::</text>
    <text x="136" y="152" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">  2305271</text>
  </g>

  <!-- location -->
  <g class="line5">
    <text x="30" y="172" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">location   </text>
    <text x="118" y="172" font-family="Share Tech Mono, monospace" font-size="13" fill="#444">::</text>
    <text x="136" y="172" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">  /dev/null → delusional</text>
  </g>

  <!-- focus -->
  <g class="line6">
    <text x="30" y="192" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">focus      </text>
    <text x="118" y="192" font-family="Share Tech Mono, monospace" font-size="13" fill="#444">::</text>
    <text x="136" y="192" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">  reverse engineering</text>
  </g>

  <!-- focus sub -->
  <g class="line7">
    <text x="136" y="212" font-family="Share Tech Mono, monospace" font-size="13" fill="#666">  ↳ low-level systems  ·  web backends</text>
  </g>

  <!-- status -->
  <g class="line8">
    <text x="30" y="235" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">threat     </text>
    <text x="118" y="235" font-family="Share Tech Mono, monospace" font-size="13" fill="#444">::</text>
    <text x="136" y="235" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">  ██████████░░  [ mostly harmless ]</text>
  </g>

  <!-- Divider 2 -->
  <g class="line9">
    <text x="20" y="258" font-family="Share Tech Mono, monospace" font-size="13" fill="#333">────────────────────────────────────────────────────</text>
  </g>

  <!-- Next prompt -->
  <g class="line9">
    <text x="20" y="280" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">┌──[</text>
    <text x="60" y="280" font-family="Share Tech Mono, monospace" font-size="13" fill="#fff">cxern</text>
    <text x="100" y="280" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">@null]──[~]</text>
    <text x="20" y="298" font-family="Share Tech Mono, monospace" font-size="13" fill="#555">└─$ </text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="50" y="285" width="8" height="14" fill="#ffffff"/>
</svg>
