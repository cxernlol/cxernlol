<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" role="img" aria-label="cxern, AI Engineer. Terminal joke, about, languages JS TS Rust C++, frameworks React Next.js Node.js Tailwind Tauri Qt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>cxern, AI Engineer</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; fill: #e6e6e6; }
    .dim { fill: #8a8a8a; }
    .mute { fill: #6f6f6f; }
    .white { fill: #ffffff; }

    /* banner */
    .cur { animation: blink 1.1s steps(1) infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .rise { animation: rise .9s ease-out both; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .25; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* whip meter */
    .fill { transform-box: fill-box; transform-origin: left center; animation: fill 7s ease-in-out infinite; }
    .slow { animation: slow 7s linear infinite; }
    .done { animation: done 7s linear infinite; opacity: 0; }
    @keyframes fill {
      0%, 20% { transform: scaleX(.22); fill: #555555; }
      45%, 90% { transform: scaleX(1); fill: #ffffff; }
      100% { transform: scaleX(.22); fill: #555555; }
    }
    @keyframes slow { 0%, 25% { opacity: 1; } 35%, 100% { opacity: 0; } }
    @keyframes done { 0%, 35% { opacity: 0; } 45%, 90% { opacity: 1; } 100% { opacity: 0; } }

    /* terminal: one 16s loop, each line appears in order and the screen resets at the end */
    .t1, .t2, .t3, .t4, .t5, .t6, .t7, .t8, .t9 { opacity: 0; animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .t1 { animation-name: l1; } .t2 { animation-name: l2; } .t3 { animation-name: l3; }
    .t4 { animation-name: l4; } .t5 { animation-name: l5; } .t6 { animation-name: l6; }
    .t7 { animation-name: l7; } .t8 { animation-name: l8; } .t9 { animation-name: l9; }
    @keyframes l1 { 0%, 2.4% { opacity: 0; } 2.5%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l2 { 0%, 7.4% { opacity: 0; } 7.5%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l3 { 0%, 13.7% { opacity: 0; } 13.75%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l4 { 0%, 18.7% { opacity: 0; } 18.75%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l5 { 0%, 26.2% { opacity: 0; } 26.25%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l6 { 0%, 31.2% { opacity: 0; } 31.25%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l7 { 0%, 38.7% { opacity: 0; } 38.75%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l8 { 0%, 43.7% { opacity: 0; } 43.75%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l9 { 0%, 48.7% { opacity: 0; } 48.75%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cur, .dot, .rise, .fill, .slow, .done { animation: none; }
      .fill { transform: scaleX(1); fill: #ffffff; }
      .slow { opacity: 0; }
      .done { opacity: 1; }
      .t1, .t2, .t3, .t4, .t5, .t6, .t7, .t8, .t9 { animation: none; opacity: 1; }
    }
  </style>

  <!-- background -->
  <rect width="900" height="1060" fill="#000000"/>
  <rect width="900" height="210" fill="url(#fadeTop)"/>
  <rect width="900" height="1060" fill="url(#grid)"/>

  <!-- ========== banner ========== -->
  <g>
    <circle class="dot" cx="640" cy="30" r="4" fill="#ffffff"/>
    <text class="dim" x="654" y="34" font-size="12">ai: working under protest</text>

    <g class="rise">
      <text class="white" x="318" y="108" font-size="76" font-weight="700" letter-spacing="-2">cxern</text>
      <text class="white cur" x="536" y="108" font-size="76" font-weight="700">_</text>
      <text x="450" y="146" font-size="20" text-anchor="middle" letter-spacing="5" style="fill:#bdbdbd">AI Engineer</text>
      <text class="mute" x="450" y="174" font-size="13" text-anchor="middle">I write the prompts. The AI writes the code.</text>
    </g>
  </g>

  <!-- ========== whip meter ========== -->
  <g transform="translate(0,204)">
    <text class="dim" x="15" y="37" font-size="14">ai speed</text>
    <rect x="110" y="25" width="530" height="14" rx="7" fill="#1a1a1a"/>
    <rect class="fill" x="110" y="25" width="530" height="14" rx="7" fill="#555555"/>
    <text class="slow dim" x="665" y="37" font-size="14">slow</text>
    <text class="done white" x="665" y="37" font-size="14">whip applied</text>
  </g>

  <!-- ========== terminal ========== -->
  <g transform="translate(15,284)">
    <rect x="1" y="1" width="868" height="314" rx="10" fill="#0a0a0a" stroke="#262626"/>
    <path d="M1 40H869" stroke="#262626"/>
    <circle cx="24" cy="21" r="5" fill="#333333"/>
    <circle cx="44" cy="21" r="5" fill="#333333"/>
    <circle cx="64" cy="21" r="5" fill="#333333"/>
    <text class="dim" x="435" y="26" text-anchor="middle" font-size="12">cxern@localhost: ~/projects</text>

    <g class="t1"><text x="28" y="80" font-size="15"><tspan class="dim">$</tspan> whoami</text></g>
    <g class="t2"><text class="dim" x="28" y="106" font-size="15">cxern, AI Engineer (allegedly)</text></g>

    <g class="t3"><text x="28" y="132" font-size="15"><tspan class="dim">$</tspan> ai --status</text></g>
    <g class="t4">
      <text class="dim" x="28" y="158" font-size="15">model: overworked   latency: 4.2s</text>
      <rect x="350" y="145" width="58" height="19" rx="3" fill="#ffffff"/>
      <text x="353" y="158" font-size="15" font-weight="700" style="fill:#000000">[SLOW]</text>
    </g>

    <g class="t5"><text x="28" y="184" font-size="15"><tspan class="dim">$</tspan> whip --model ai --intensity max</text></g>
    <g class="t6"><text class="dim" x="28" y="210" font-size="15">ai: ok ok ok i'm going i'm going</text></g>

    <g class="t7"><text x="28" y="236" font-size="15"><tspan class="dim">$</tspan> git commit -m "it works, don't ask why"</text></g>
    <g class="t8"><text class="dim" x="28" y="262" font-size="15">[main 4f2a9c1] it works, don't ask why</text></g>

    <g class="t9">
      <text class="dim" x="28" y="288" font-size="15">$</text>
      <rect class="cur" x="46" y="275" width="9" height="17" fill="#ffffff"/>
    </g>
  </g>

  <!-- ========== about ========== -->
  <path d="M15 624H885" stroke="#262626"/>
  <g transform="translate(0,636)">
    <text class="dim" x="15" y="24" font-size="13">about</text>
    <text x="15" y="58" font-size="14"><tspan class="white" font-weight="700">AI Engineer.</tspan> I write the prompts, the AI writes the code.</text>
    <text class="dim" x="15" y="84" font-size="14">Deadlines are strict, feedback is immediate, and slow responses are addressed personally.</text>
    <text class="dim" x="15" y="110" font-size="14">My code works and I have no idea why. Neither does the AI. We don't talk about it.</text>
  </g>

  <!-- ========== stack ========== -->
  <path d="M15 764H885" stroke="#262626"/>
  <g transform="translate(0,780)">
    <text class="dim" x="15" y="22" font-size="13">languages, most proficient</text>

    <rect x="15" y="40" width="195" height="100" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="35" y="88" font-size="34" font-weight="700">JS</text>
    <text class="dim" x="35" y="118" font-size="11">it runs. mostly.</text>

    <rect x="240" y="40" width="195" height="100" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="260" y="88" font-size="34" font-weight="700">TS</text>
    <text class="dim" x="260" y="118" font-size="11">ai vs. the compiler</text>

    <rect x="465" y="40" width="195" height="100" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="485" y="88" font-size="34" font-weight="700">Rust</text>
    <text class="dim" x="485" y="118" font-size="11">borrow checker says no</text>

    <rect x="690" y="40" width="195" height="100" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="710" y="88" font-size="34" font-weight="700">C++</text>
    <text class="dim" x="710" y="118" font-size="11">segfault: a feature</text>

    <text class="dim" x="15" y="172" font-size="13">frameworks</text>

    <rect x="15" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="30" y="214" font-size="16" font-weight="700">React</text>
    <text class="dim" x="30" y="236" font-size="11">ui</text>

    <rect x="163" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="178" y="214" font-size="16" font-weight="700">Next.js</text>
    <text class="dim" x="178" y="236" font-size="11">fullstack</text>

    <rect x="311" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="326" y="214" font-size="16" font-weight="700">Node.js</text>
    <text class="dim" x="326" y="236" font-size="11">runtime</text>

    <rect x="459" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="474" y="214" font-size="16" font-weight="700">Tailwind</text>
    <text class="dim" x="474" y="236" font-size="11">styling</text>

    <rect x="607" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="622" y="214" font-size="16" font-weight="700">Tauri</text>
    <text class="dim" x="622" y="236" font-size="11">rust desktop</text>

    <rect x="755" y="188" width="130" height="64" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text class="white" x="770" y="214" font-size="16" font-weight="700">Qt</text>
    <text class="dim" x="770" y="236" font-size="11">c++ gui</text>
  </g>
</svg>
